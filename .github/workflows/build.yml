name: Build installers

# Every native platform must pass before its installers become a public update.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: doneline-release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build ${{ matrix.platform }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            script: dist:win
            arch: x64
          - platform: mac-arm64
            os: macos-15
            script: dist:mac
            arch: arm64
          - platform: mac-x64
            os: macos-15-intel
            script: dist:mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag matches the app version
        run: node scripts/check-release-tag.cjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mcp
      - name: Package the tested app without publishing
        run: npm run ${{ matrix.script }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged native database and actual app startup
        run: node tests/packaged-runtime.cjs --launch
      - name: Upload verified installers and updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: doneline-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete GitHub update
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: doneline-*
          path: downloaded
      - name: Merge Mac architectures and verify every updater checksum
        run: node scripts/prepare-release.cjs downloaded release-publish
      - name: Upload all assets before making the release visible
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('This version is already public. Bump the version instead of replacing an update.')"
          else
            gh release create "$TAG" --verify-tag --draft --title "Doneline $VERSION" --notes-file build/release-notes.md
          fi
          gh release upload "$TAG" release-publish/* --clobber
          gh release edit "$TAG" --draft=false --latest
